org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# `org.gradle.java.home` deliberately does not live here.
#
# This file is tracked, so any path in it is imposed on every machine that builds
# the repo, including Linux CI runners. A developer-local JDK path (for example a
# Windows "C:/Users/..." install) made every CI job fail during Gradle
# configuration with "Java home supplied is invalid", before any build or test
# work began.
#
# To pin a JDK locally, put it in the user-level properties file instead, which is
# outside version control and takes precedence over this one:
#
#     %USERPROFILE%\.gradle\gradle.properties   (Windows)
#     ~/.gradle/gradle.properties                (macOS / Linux)
#
# CI provisions its own JDK with actions/setup-java and must stay unconstrained.
