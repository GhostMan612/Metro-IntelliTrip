name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

# `bash ./gradlew` rather than `./gradlew`. The wrapper's executable bit is
      # recorded as 100755 in git, but a checkout that loses it (or a runner that
      # does not honor it) fails with exit 126 "Permission denied" before Gradle
      # starts, which silently skips every later step. Invoking bash explicitly
      # makes the workflow independent of file mode.
      - name: Unit tests
        run: bash ./gradlew test --console=plain

      - name: Real-feed verification (Metro Transit GTFS)
        run: |
          curl -sSf -o gtfs-metro-transit.zip https://svc.metrotransit.org/mtgtfs/gtfs.zip
          test -s gtfs-metro-transit.zip  # a missing/empty fixture must fail the gate
          ls -lh gtfs-metro-transit.zip
          bash ./gradlew -Dintellitrip.gtfs.fixture="$GITHUB_WORKSPACE/gtfs-metro-transit.zip" :core:atlas-gtfs-static:jvmTest --tests "*RealFeedSmokeTest" --rerun-tasks --console=plain
          bash ./gradlew -Dintellitrip.gtfs.fixture="$GITHUB_WORKSPACE/gtfs-metro-transit.zip" :core:atlas-routing:jvmTest --tests "*RealFeedPlanTimeTest" --rerun-tasks --console=plain

      - name: Android lint
        run: bash ./gradlew lint --console=plain

      - name: Assemble debug
        run: bash ./gradlew assembleDebug --console=plain

      - name: Portable JVM sample host
        run: bash ./gradlew :sample:host:run --console=plain

  android-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # GitHub-hosted SDK downloads occasionally yield a corrupt emulator ZIP.
      # Preinstall with a bounded retry so the action does not fail during
      # setup and then mask the real cause by killing a nonexistent emulator.
      - name: Preflight Android Emulator package (bounded ZIP retry)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?ANDROID_HOME is required}"
          for attempt in 1 2 3; do
            echo "Checking Android Emulator package, attempt ${attempt}/3"
            if sdkmanager --install "emulator" --channel=0 \
                && test -x "$sdk/emulator/emulator" \
                && "$sdk/emulator/emulator" -version >/dev/null 2>&1; then
              echo "Android Emulator is installed and runnable."
              exit 0
            fi
            echo "::warning::Android Emulator package install failed or binary unusable (${attempt}/3)."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android Emulator unavailable after three install attempts."
              exit 1
            fi
            # Only CI's temporary download staging is removed; no app or SDK data.
            rm -rf -- "$sdk/.temp"
            sleep $((attempt * 10))
          done

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: bash ./gradlew :app:connectedDebugAndroidTest --console=plain
          disable-animations: true