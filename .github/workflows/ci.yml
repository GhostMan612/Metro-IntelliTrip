name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

# `bash ./gradlew` rather than `./gradlew`. The wrapper's executable bit is
      # recorded as 100755 in git, but a checkout that loses it (or a runner that
      # does not honor it) fails with exit 126 "Permission denied" before Gradle
      # starts, which silently skips every later step. Invoking bash explicitly
      # makes the workflow independent of file mode.
      - name: Fetch real-feed GTFS fixture
        run: |
          curl -sSf -o gtfs-metro-transit.zip https://svc.metrotransit.org/mtgtfs/gtfs.zip
          test -s gtfs-metro-transit.zip  # a missing/empty fixture must fail the gate
          ls -lh gtfs-metro-transit.zip

      - name: Unit tests and real-feed verification
        run: bash ./gradlew -Dintellitrip.gtfs.fixture="$GITHUB_WORKSPACE/gtfs-metro-transit.zip" test jvmTest --console=plain

      - name: Android lint
        run: bash ./gradlew lint --console=plain

      - name: Assemble debug
        run: bash ./gradlew assembleDebug --console=plain

      - name: Portable JVM sample host
        run: bash ./gradlew :sample:host:run --console=plain

      # The consumer is a separate Gradle build that can only see the published
      # Maven artifacts, not the source modules. It is the check that catches an
      # incomplete POM or an accidental Android/build-time dependency leak.
      - name: Published SDK external consumer
        run: |
          bash ./gradlew publishAtlasToLocalRepo --console=plain
          bash ./gradlew -p sample/sdk-consumer run --console=plain

      - name: Portable publication contract
        run: |
          VERSION=$(python3 - <<'PY'
          from pathlib import Path
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              if line.startswith("atlasVersion="):
                  print(line.split("=", 1)[1].strip())
                  break
          else:
              raise SystemExit("atlasVersion is not set in gradle.properties")
          PY
          )
          python3 tools/atlas_maven.py stage \
            --source build/atlas-maven \
            --destination build/atlas-publication \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --repository-url "https://github.com/${{ github.repository }}" \
            --gradle-version "$(bash ./gradlew --version | awk '/^Gradle /{print $2; exit}')" \
            --java-version "$(java -version 2>&1 | head -n1)"
          python3 tools/atlas_maven.py verify \
            --repo build/atlas-publication \
            --version "$VERSION"
          bash ./gradlew -p sample/sdk-consumer run \
            --refresh-dependencies \
            -PatlasMavenUrl="file://$PWD/build/atlas-publication" \
            -PatlasVersion="$VERSION" \
            --console=plain

  android-tests:
    name: Instrumented tests
    # ubuntu-latest resolved to Ubuntu 26.04 during the emulator ZIP failures.
    # Keep instrumented tests on the proven 24.04 image until SDK compatibility is verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner action downloads the emulator itself, and a truncated package
      # previously surfaced as "Error reading Zip content from a SeekableByteChannel"
      # with the emulator never launching. Install the current stable emulator first
      # with retries; the action's install step then sees a complete local package
      # and skips the download.
      - name: Install emulator with retry
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "emulator" "platform-tools" "system-images;android-34;default;x86_64"; then
              exit 0
            fi
            echo "emulator install attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          script: bash ./gradlew :app:connectedDebugAndroidTest --console=plain
          disable-animations: true