name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `bash ./gradlew` rather than `./gradlew`. The wrapper's executable bit is
      # recorded as 100755 in git, but a checkout that loses it (or a runner that
      # does not honor it) fails with exit 126 "Permission denied" before Gradle
      # starts — which silently skips every later step. Invoking bash explicitly
      # makes the workflow independent of file mode.
      - name: Unit tests
        run: bash ./gradlew test --console=plain

      - name: Android lint
        run: bash ./gradlew lint --console=plain

      - name: Assemble debug
        run: bash ./gradlew assembleDebug --console=plain

      - name: Portable JVM sample host
        run: bash ./gradlew :sample:host:run --console=plain

  android-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: bash ./gradlew :app:connectedDebugAndroidTest --console=plain
          disable-animations: true